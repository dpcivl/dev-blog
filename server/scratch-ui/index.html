<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- nginx 가 요청마다 무작위 값으로 바꾼다 (sub_filter). CodeMirror 가 자기 <style> 에
         붙여서 CSP 의 style-src 를 통과한다 — 'unsafe-inline' 을 열지 않으려고 -->
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <title>scratch · parkhyo.in</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="side" aria-label="메모 목록">
        <div class="side-head">
          <span class="brand">scratch</span>
          <button type="button" class="btn btn-quiet" id="new">새 메모</button>
        </div>

        <form class="new-form" id="new-form" hidden>
          <label class="sr" for="new-input">새 메모 이름</label>
          <input
            id="new-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="이름 (공백은 - 로 바뀝니다)"
            maxlength="117"
          />
          <div class="new-actions">
            <button type="submit" class="btn btn-primary">만들기</button>
            <button type="button" class="btn btn-quiet" id="new-cancel">취소</button>
          </div>
        </form>

        <ul class="list" id="list"></ul>
      </aside>

      <main class="main">
        <div class="bar">
          <div class="title">
            <h1 id="name">메모를 고르세요</h1>
            <span class="badge" id="badge" hidden>준비됨</span>
          </div>
          <div class="actions">
            <span class="status" id="status" aria-live="polite"></span>
            <button type="button" class="btn btn-quiet" id="save" disabled>
              저장 <kbd>⌘S</kbd>
            </button>
            <button type="button" class="btn btn-primary" id="ready" disabled>완성</button>
          </div>
        </div>

        <div class="editor" id="editor"></div>

        <p class="hint">
          마크다운으로 쓰면 바로 서식이 보이고, 커서를 그 줄에 두면 원문이 보입니다 · 이미지는
          붙여넣거나 끌어다 놓으면 올라갑니다 · 다 쓰면 「완성」
        </p>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
