<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>목업 · 다듬기 제안 — scratch</title>
    <!-- 운영 화면과 같은 색·버튼을 쓰려고 진짜 app.css 를 건다 -->
    <link rel="stylesheet" href="../app.css" />
    <style>
      /* 목업에서만 쓰는 것. 실제 구현에서는 app.css 로 옮긴다 */
      .mock-note {
        margin: 0;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .wrap {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        height: calc(100% - 33px);
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .bar h1 {
        margin: 0;
        font-size: 15px;
      }
      .views {
        display: flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .views button {
        padding: 4px 10px;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .views button[aria-pressed="true"] {
        color: var(--text);
        background: var(--active);
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 16px;
      }

      /* ── 다듬기 ── */
      .lede {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .lede p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .lede strong {
        color: var(--text);
      }
      .sug {
        margin-bottom: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .sug.gone {
        display: none;
      }
      .sug-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .kind {
        padding: 1px 7px;
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .kind.note {
        color: var(--muted);
      }
      .where {
        margin-left: auto;
      }
      .quote {
        margin: 0 0 8px;
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.7;
        word-break: break-word;
        background: var(--bg);
        border-radius: 8px;
      }
      .hit {
        padding: 1px 2px;
        border-bottom: 2px dotted var(--accent);
      }
      .to {
        color: var(--ready);
        font-weight: 600;
      }
      .why {
        margin: 0 0 10px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .btn-small {
        padding: 4px 10px;
        font-size: 12px;
      }
      .acts .off {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
        background: none;
        border: 0;
        cursor: pointer;
        text-decoration: underline;
      }
      .empty {
        padding: 28px 8px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      .rules {
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted);
      }
      .rules summary {
        cursor: pointer;
      }
      .rules ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      .rules li {
        margin: 3px 0;
      }
      .rules button {
        font: inherit;
        font-size: 11px;
        color: var(--accent);
        background: none;
        border: 0;
        cursor: pointer;
        text-decoration: underline;
      }

      /* ── 쓰기 보기 (제안이 어디서 나오는지 보여주려고 ) ── */
      .sec {
        margin-bottom: 14px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .sec-title {
        width: 100%;
        margin-bottom: 8px;
        padding: 6px 8px;
        font: inherit;
        font-weight: 600;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      textarea.doc {
        display: block;
        width: 100%;
        min-height: 140px;
        padding: 8px;
        font: inherit;
        font-size: 14px;
        line-height: 1.7;
        color: var(--text);
        resize: vertical;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .count {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <p class="mock-note">
      목업 — 「다듬기」 제안. 규칙은 CLAUDE.md 1 · 2-1 · 9 번에서 가져왔다. 모델은 안 쓴다
      (토큰 · 네트워크 0)
    </p>

    <div class="wrap">
      <aside class="side" aria-label="메모 목록">
        <div class="side-head"><span class="brand">scratch</span></div>
        <ul class="list">
          <li><button type="button" class="on">에이전트-파이프라인</button></li>
        </ul>
      </aside>

      <section class="pane">
        <div class="bar">
          <h1>글 짜기</h1>
          <div class="views" role="group" aria-label="보기">
            <button type="button" data-view="write" aria-pressed="false">쓰기</button>
            <button type="button" data-view="polish" aria-pressed="true">다듬기</button>
          </div>
        </div>

        <div class="body" id="write" hidden></div>

        <div class="body" id="polish">
          <div class="lede">
            <p id="lede-text"></p>
            <button type="button" class="btn btn-quiet btn-small" id="recheck">다시 보기</button>
          </div>
          <div id="list"></div>

          <details class="rules">
            <summary>어떤 규칙으로 보나 — 끌 수 있다</summary>
            <ul id="rule-list"></ul>
          </details>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      // ────────────────────────────────────────────────────────────
      // 규칙. 전부 CLAUDE.md 에서 가져왔다 — 작성자가 직접 적어둔 기준이다.
      // 그래서 이건 AI 가 문장을 고치는 게 아니라 작성자의 기준을 기계가 짚는 것이다.
      //
      // fix 가 있으면 「이대로 고치기」를 준다. 없으면 짚어만 둔다.
      // ────────────────────────────────────────────────────────────
      const RULES = [
        {
          id: "ending",
          name: "메모 어미",
          why: "메모에 쓰는 축약형이다. 발행본은 ~다 로 통일돼 있다 (CLAUDE.md 1번 표)",
          // 「~함/~봄」과 「문장 끝 명사형」을 한 규칙으로 둔다. 둘 다 같은 표에서 왔고,
          // 쪼개두면 하나를 꺼도 다른 하나가 같은 자리에 올라온다 (3차에서 걸렸다)
          find: /(확인함|확인했음|했음|했었음|봤음|였음|있었음|없었음|싶어짐|예상됨|좋을 듯)(?=[\s.,)」』]|$)|(됨|나옴|잡음|잡힘|만듦|넘어감|생김|드러남)(?=[.\n]|$)/g,
          fix: m =>
            ({
              확인함: "확인했다",
              확인했음: "확인했다",
              했음: "했다",
              했었음: "했었다",
              봤음: "봤다",
              였음: "였다",
              있었음: "있었다",
              없었음: "없었다",
              싶어짐: "싶어졌다",
              예상됨: "예상된다",
              "좋을 듯": "좋겠다",
              됨: "된다",
              나옴: "나온다",
              잡음: "잡는다",
              잡힘: "잡힌다",
              만듦: "만든다",
              넘어감: "넘어간다",
              생김: "생긴다",
              드러남: "드러난다",
            })[m],
        },
        {
          id: "loan",
          name: "영어 음역",
          why: "자연스러운 한국어 대체어가 있다 (CLAUDE.md 2-1 표)",
          find: /(큰 레버|가장 큰 레버|파킹했다|배선했다|캡쳐했다|얼라인했다|스코프했다)/g,
          fix: m =>
            ({
              "큰 레버": "큰 개선",
              "가장 큰 레버": "제일 큰 병목",
              파킹했다: "미뤘다",
              배선했다: "걸어뒀다",
              캡쳐했다: "잡았다",
              얼라인했다: "맞췄다",
              스코프했다: "범위를 정했다",
            })[m],
        },
        {
          id: "meta",
          name: "자기지시 메타",
          why: "글이 스스로에 대해 이야기한다. 요지는 실행으로 보여준다 (CLAUDE.md 2-1)",
          find: /(이게 이 글의 요지다|이 글에서 하고 싶은 말|이 글에서 제일 하고 싶은 말이기도 하다)/g,
          fix: null, // 대체어가 없다 — 짚어만 둔다
        },
        {
          id: "aside",
          name: "시적 아사이드",
          why: "문장 끝에 붙는 명상적 코멘트다. AI 티가 가장 크게 나는 자리다 (CLAUDE.md 2-1)",
          find: /(그게 더 (오래 )?남(는다|을 것 같다))/g,
          fix: null,
        },
        {
          id: "promise",
          name: "다음 글 예고",
          why: "그 글이 안 나오면 약속이 박제된다 (CLAUDE.md 3번)",
          find: /(다음 글에서|다음은 .{0,12}로|곧 .{0,12}예정)/g,
          fix: null,
        },
        {
          id: "tilde-range",
          name: "숫자 범위에 쓴 물결",
          why: "`~1.5~2주` 처럼 쓰면 마크다운이 취소선으로 읽어 글자가 그어진 채 발행된다. 빌드도 링크 검사도 통과해서 조용히 나간다. 범위는 en dash 로 쓴다",
          // 범위를 통째로 잡는다. 일부만 잡으면 고쳤을 때 글이 더 망가진다 (1차에서 걸렸다)
          find: /~?(\d[\d.]*)\s*~\s*(\d[\d.]*)(\S*)~?/g,
          fix: m => {
            const [, a, b, tail] = /~?(\d[\d.]*)\s*~\s*(\d[\d.]*)(\S*)~?/.exec(m);
            return `${a}–${b}${tail.replace(/~$/, "")}`;
          },
        },
        {
          id: "tilde-about",
          name: "앞머리 물결 (~3일)",
          why: "「대략」을 물결로 쓰면 뒤에 물결이 하나 더 나올 때 취소선이 된다. 「약」으로 쓴다",
          find: /~(\d[\d.]*\s*\S*)/g,
          fix: m => "약 " + m.slice(1),
        },
        {
          id: "marker",
          name: "메모 표기 (? ! +) 가 남았다",
          why: "`?` 는 「더 공부해볼 것」으로, `!` 와 `+` 는 본문에 풀어 쓴다 (CLAUDE.md 메모 표기 규약)",
          find: /^[ \t]*[?+](?=\S)/gm,
          fix: null,
        },
      ];

      // ── 시험용 원고. 일부러 규칙에 걸리는 줄을 섞어뒀다 ──
      const SECTIONS = [
        {
          title: "배경",
          body: `X에서 앤스로픽 엔지니어가 에이전트 파이프라인을 발표하는 것을 보고 구현하고 싶어짐
토큰 낭비가 심할 것으로 예상됨. 홍보 영상일 수도 있지만 신기술을 써보고 싶었음

?파이프라인이 실제로 토큰을 얼마나 쓰는지 모르겠다`,
        },
        {
          title: "해본 것",
          body: `에이전트를 여섯 개로 나눠서 역할을 스코프했다. 리뷰와 보안은 서로 안 보게 배선했다.
소요 시간은 ~1.5~2주~ 정도였다.
제일 큰 레버는 결정론적 검사를 메인이 직접 돌리는 것이었다.`,
        },
        {
          title: "회고",
          body: `역할을 나눈 값은 있었다. 그게 더 오래 남을 것 같다.
이게 이 글의 요지다.
다음 글에서 토큰 계산을 자세히 다룬다.`,
        },
      ];

      // ── 상태 ──
      const off = new Set(); // 꺼둔 규칙
      const dismissed = new Set(); // 「그냥 두기」 한 제안
      let sections = SECTIONS.map(s => ({ ...s }));

      const $ = s => document.querySelector(s);
      const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

      let toastTimer;
      function toast(msg) {
        const el = $("#toast");
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.hidden = true), 2600);
      }

      // ── 제안 모으기 ──
      function collect() {
        const out = [];
        sections.forEach((sec, si) => {
          const lines = sec.body.split("\n");
          for (const rule of RULES) {
            if (off.has(rule.id)) continue;
            lines.forEach((line, li) => {
              rule.find.lastIndex = 0;
              let m;
              while ((m = rule.find.exec(line)) !== null) {
                const key = `${si}:${li}:${m.index}:${rule.id}`;
                if (dismissed.has(key)) continue;
                out.push({
                  key,
                  rule,
                  si,
                  li,
                  at: m.index,
                  text: m[0],
                  to: rule.fix ? rule.fix(m[0]) : null,
                  line,
                  where: sec.title || `${si + 1}번째 덩어리`,
                });
                if (m[0] === "") rule.find.lastIndex++;
              }
            });
          }
        });

        // 읽는 순서대로. 원고는 위에서 아래로 읽는다
        out.sort((x, y) => x.si - y.si || x.li - y.li || x.at - y.at);

        // 겹치는 제안은 하나만 남긴다. 먼저 잡은 쪽이 이긴다 —
        // 둘을 다 보여주면 어느 쪽을 누를지 사람이 판단해야 하는데,
        // 그건 이 기능이 덜어주려던 일이다 (1차에서 `예상됨` 이 두 규칙에 걸렸다)
        const kept = [];
        for (const it of out) {
          const end = it.at + it.text.length;
          const overlaps = kept.some(
            k => k.si === it.si && k.li === it.li && it.at < k.at + k.text.length && end > k.at
          );
          if (!overlaps) kept.push(it);
        }
        return kept;
      }

      // ── 그리기 ──
      function render() {
        const items = collect();
        const fixable = items.filter(i => i.to !== null).length;

        // 「그냥 두기」 한 것을 「걸리는 게 없다」 로 말하면 거짓이다. 고친 게 아니라 넘긴 것이다
        const skipped = dismissed.size;
        $("#lede-text").innerHTML = items.length
          ? `제안 <strong>${items.length}개</strong> · 고칠 수 있는 것 ${fixable}개 · 나머지는 짚어만 둔 것이다. <strong>하나도 안 고쳐도 저장된다.</strong>`
          : skipped
            ? `남은 제안이 없다 — <strong>${skipped}개를 그냥 뒀다.</strong> 「다시 보기」로 되살린다.`
            : `걸리는 게 없다. <strong>저장해도 된다.</strong>`;

        const list = $("#list");
        list.textContent = "";
        if (!items.length) {
          const p = document.createElement("p");
          p.className = "empty";
          p.textContent = "제안이 없다. (「그냥 두기」 한 것도 여기 다시 안 뜬다)";
          list.append(p);
        }

        for (const it of items) {
          const card = document.createElement("div");
          card.className = "sug";

          const before = esc(it.line.slice(0, it.at));
          const hit = esc(it.text);
          const after = esc(it.line.slice(it.at + it.text.length));
          const arrow = it.to ? ` → <span class="to">${esc(it.to)}</span>` : "";

          card.innerHTML = `
            <div class="sug-head">
              <span class="kind${it.to ? "" : " note"}">${it.to ? "고칠 수 있다" : "짚어만 둠"}</span>
              <span>${esc(it.rule.name)}</span>
              <span class="where">${esc(it.where)} · ${it.li + 1}번째 줄</span>
            </div>
            <p class="quote">${before}<span class="hit">${hit}</span>${after}${arrow}</p>
            <p class="why">${it.rule.why}</p>
            <div class="acts">
              ${it.to ? '<button type="button" class="btn btn-primary btn-small act-fix">이대로 고치기</button>' : ""}
              <button type="button" class="btn btn-quiet btn-small act-skip">그냥 두기</button>
              <button type="button" class="off act-off">이 규칙 안 볼래</button>
            </div>`;

          card.querySelector(".act-fix")?.addEventListener("click", () => applyFix(it));
          card.querySelector(".act-skip").addEventListener("click", () => {
            dismissed.add(it.key);
            toast("그냥 뒀습니다. 이 메모에서 다시 안 뜹니다");
            render();
          });
          card.querySelector(".act-off").addEventListener("click", () => {
            off.add(it.rule.id);
            toast(`「${it.rule.name}」 규칙을 껐습니다. 아래 「어떤 규칙으로 보나」에서 되살립니다`);
            render();
          });
          list.append(card);
        }

        // 규칙 목록 (끄고 켜기)
        const rl = $("#rule-list");
        rl.textContent = "";
        for (const r of RULES) {
          const li = document.createElement("li");
          const isOff = off.has(r.id);
          li.innerHTML = `${esc(r.name)} — <button type="button">${isOff ? "다시 보기" : "안 보기"}</button>`;
          if (isOff) li.style.opacity = ".5";
          li.querySelector("button").addEventListener("click", () => {
            if (isOff) off.delete(r.id);
            else off.add(r.id);
            render();
          });
          rl.append(li);
        }

        renderWrite();
      }

      function applyFix(it) {
        const sec = sections[it.si];
        const lines = sec.body.split("\n");
        const line = lines[it.li];
        lines[it.li] = line.slice(0, it.at) + it.to + line.slice(it.at + it.text.length);
        sec.body = lines.join("\n");
        toast(`「${it.text}」를 「${it.to}」로 고쳤습니다. ⌘Z 가 아니라 여기서 되돌립니다`);
        render();
      }

      // ── 쓰기 보기 (제안이 본문을 실제로 고치는 걸 보여주려고) ──
      function renderWrite() {
        const w = $("#write");
        if (w.hidden) return;
        w.textContent = "";
        sections.forEach((s, i) => {
          const box = document.createElement("div");
          box.className = "sec";
          const t = document.createElement("input");
          t.className = "sec-title";
          t.value = s.title;
          t.addEventListener("input", () => (sections[i].title = t.value));
          const ta = document.createElement("textarea");
          ta.className = "doc";
          ta.value = s.body;
          ta.addEventListener("input", () => (sections[i].body = ta.value));
          box.append(t, ta);
          w.append(box);
        });
      }

      // ── 보기 전환 ──
      document.querySelectorAll(".views button").forEach(b => {
        b.addEventListener("click", () => {
          const v = b.dataset.view;
          document.querySelectorAll(".views button").forEach(x => {
            x.setAttribute("aria-pressed", String(x === b));
          });
          $("#write").hidden = v !== "write";
          $("#polish").hidden = v !== "polish";
          render();
        });
      });

      $("#recheck").addEventListener("click", () => {
        dismissed.clear();
        toast("「그냥 두기」 한 것까지 다시 봅니다");
        render();
      });

      render();
    </script>
  </body>
</html>
