<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>목업 · 초안 결정 → 구조 다시 짜기 (scratch)</title>

    <!-- 실제 화면의 스타일시트를 그대로 쓴다. 목업이 따로 색을 들고 있으면
         지금 화면과 갈라져서 보는 의미가 없다 -->
    <link rel="stylesheet" href="../app.css" />
    <style>
      /* ── 목업에만 있는 것 ── */
      body {
        display: flex;
        flex-direction: column;
      }

      .ribbon {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 7px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--active);
        color: var(--muted);
        font-size: 12px;
      }

      .ribbon strong {
        color: var(--text);
      }

      .app {
        flex: 1;
        min-height: 0;
      }

      .app[data-mode="draft"] {
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .app[data-mode="compose"] {
        grid-template-columns: 260px minmax(0, 1fr) minmax(340px, 32%);
      }

      /* ── 왼쪽: 구조 짜는 칸 ── */
      .compose {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border-right: 1px solid var(--border);
      }

      .views {
        display: flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .views button {
        padding: 4px 11px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .views button[aria-pressed="true"] {
        background: var(--active);
        color: var(--text);
        font-weight: 600;
      }

      .compose-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 18px 28px;
      }

      /* ── 소제목 덩어리 ── */
      .sec {
        margin: 0 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .sec[aria-current="true"] {
        border-color: var(--accent);
      }

      .sec-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 8px 7px 10px;
      }

      .sec-n {
        flex: none;
        width: 1.5em;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .sec-title {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
      }

      .sec-title:hover {
        background: var(--bg);
      }

      .sec-title::placeholder {
        font-weight: 400;
        color: var(--muted);
      }

      .here {
        flex: none;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--active);
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        visibility: hidden;
      }

      .sec[aria-current="true"] .here {
        visibility: visible;
      }

      .ico {
        flex: none;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }

      .ico:hover:not(:disabled) {
        background: var(--bg);
        color: var(--text);
      }

      .ico:disabled {
        opacity: 0.3;
        cursor: default;
      }

      .sec-body {
        display: block;
        width: 100%;
        min-height: 92px;
        padding: 0 14px 12px;
        border: 0;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        line-height: 1.75;
        resize: vertical;
      }

      .sec-body:focus-visible {
        outline-offset: -2px;
      }

      .sec-foot {
        padding: 0 14px 8px;
        color: var(--muted);
        font-size: 11px;
      }

      .add {
        width: 100%;
        padding: 9px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .add:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .skel {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 10px 0 14px;
      }

      .chip {
        padding: 3px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .chip:hover {
        border-color: var(--accent);
      }

      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--active);
        font-weight: 600;
      }

      /* ── 개요 보기 ── */
      .compose[data-view="outline"] .sec-body,
      .compose[data-view="outline"] .skel,
      .compose[data-view="outline"] .add,
      .compose[data-view="read"] .skel {
        display: none;
      }

      .compose[data-view="outline"] .sec {
        margin-bottom: 4px;
      }

      .compose[data-view="outline"] .sec-foot {
        padding: 0 14px 7px 44px;
      }

      /* ── 미리보기 ── */
      .prose {
        max-width: 38rem;
        margin: 0 auto;
        font-size: 16px;
        line-height: 1.75;
      }

      .prose h2 {
        margin: 1.8em 0 0.5em;
        font-size: 1.22em;
      }

      .prose h2:first-child {
        margin-top: 0;
      }

      .prose p {
        margin: 0 0 1em;
      }

      .prose pre {
        margin: 0 0 1em;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--active);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
        overflow-x: auto;
      }

      .prose .ph {
        display: block;
        padding: 10px;
        border: 1px dashed var(--border);
        border-radius: 6px;
        margin-bottom: 1em;
        color: var(--muted);
        font-size: 0.85em;
        text-align: center;
      }

      .prose .thin {
        color: var(--muted);
      }

      /* ── 글 정보 ── */
      details.info {
        margin-top: 16px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }

      details.info > summary {
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .f {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .f.wide {
        grid-column: 1 / -1;
      }

      .f > label {
        color: var(--muted);
        font-size: 12px;
      }

      .f input {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 14px;
      }

      .path {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }

      /* ── 오른쪽: 초안 ── */
      .draft-note {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }

      .bar-meter {
        flex: 1;
        min-width: 70px;
        height: 4px;
        border-radius: 999px;
        background: var(--border);
        overflow: hidden;
      }

      .bar-meter i {
        display: block;
        height: 100%;
        background: var(--accent);
      }

      .lines {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 10px 8px 30vh;
        overflow-y: auto;
        list-style: none;
      }

      .app[data-mode="draft"] .lines {
        max-width: 52rem;
        margin: 0 auto;
        padding: 18px 28px 30vh;
        font-size: 16px;
        line-height: 1.75;
      }

      .dl {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 2px 6px;
        border-radius: 6px;
      }

      .dl:hover {
        background: var(--bg);
      }

      .dl .mk {
        flex: none;
        width: 1.1em;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        text-align: center;
      }

      .dl[data-mk="?"] .mk {
        color: var(--accent);
      }

      .dl[data-mk="!"] .mk {
        color: var(--ready);
      }

      .dl .tx {
        flex: 1;
        min-width: 0;
      }

      .dl .tx.h2 {
        margin-top: 10px;
        font-size: 1.1em;
        font-weight: 700;
      }

      .dl .tx.code {
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--active);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        word-break: break-all;
      }

      .dl .tx.img {
        color: var(--muted);
        font-size: 0.9em;
      }

      .dl .pull {
        flex: none;
        padding: 0 7px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        line-height: 1.6;
        cursor: pointer;
        visibility: hidden;
      }

      .dl:hover .pull,
      .dl .pull:focus-visible {
        visibility: visible;
      }

      .dl .pull:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .dl.taken {
        opacity: 0.42;
      }

      .dl.taken .pull {
        display: none;
      }

      .app[data-mode="draft"] .dl .pull {
        display: none;
      }

      /* ── 저장 시트 ── */
      .scrim {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgb(0 0 0 / 45%);
        z-index: 20;
      }

      .sheet {
        width: min(560px, 100%);
        max-height: 100%;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
      }

      .sheet-head,
      .sheet-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
      }

      .sheet-head {
        border-bottom: 1px solid var(--border);
      }

      .sheet-foot {
        border-top: 1px solid var(--border);
      }

      .sheet-head h2 {
        margin: 0;
        font-size: 15px;
      }

      .sheet-body {
        padding: 14px 16px;
      }

      .steps {
        margin: 0 0 12px;
        padding-left: 1.2em;
        font-size: 13px;
      }

      .steps li {
        margin-bottom: 3px;
      }

      .sec-note {
        margin: 0;
        padding: 9px 11px;
        border-left: 3px solid var(--accent);
        border-radius: 0 6px 6px 0;
        background: var(--active);
        font-size: 12.5px;
      }

      .filepane {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 190px;
        overflow-y: auto;
      }

      /* 좁은 창 — 3열을 포기하고 초안을 아래에 붙인다. 접어두면 바만 남는다 */
      .dock-toggle {
        display: none;
      }

      @media (max-width: 1100px) {
        .app[data-mode="compose"] {
          grid-template-columns: 260px minmax(0, 1fr);
        }

        .app[data-mode="compose"] .main {
          position: fixed;
          inset: auto 0 0 0;
          height: 52%;
          border-top: 1px solid var(--border);
          background: var(--surface);
          z-index: 10;
        }

        .app[data-mode="compose"][data-dock="closed"] .main {
          height: auto;
        }

        .app[data-mode="compose"][data-dock="closed"] .lines,
        .app[data-mode="compose"][data-dock="closed"] .draft-note,
        .app[data-mode="compose"][data-dock="closed"] .hint {
          display: none;
        }

        .app[data-mode="compose"] .dock-toggle {
          display: inline-flex;
        }

        .app[data-mode="compose"] .compose-body {
          padding-bottom: 54vh;
        }

        .app[data-mode="compose"][data-dock="closed"] .compose-body {
          padding-bottom: 80px;
        }
      }

      @media (max-width: 760px) {
        .app[data-mode="draft"],
        .app[data-mode="compose"] {
          grid-template-columns: minmax(0, 1fr);
        }

        .side {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="ribbon">
      <strong>목업</strong>
      <span>
        아무것도 저장되지 않는다 · 왼쪽은 <strong>구조를 다시 짜는 칸</strong>이다 — 문장은 전부
        사람이 쓴다
      </span>
    </div>

    <div class="app" id="app" data-mode="draft">
      <!-- ── 메모 목록 ── -->
      <aside class="side" aria-label="메모 목록">
        <div class="side-head">
          <span class="brand">scratch</span>
          <button type="button" class="btn btn-quiet">새 메모</button>
        </div>
        <ul class="list" id="list"></ul>
      </aside>

      <!-- ── 왼쪽: 구조 짜는 칸 ── -->
      <section class="compose" id="compose" data-view="write" aria-label="글 짜기" hidden>
        <div class="bar">
          <div class="title">
            <h1>글 짜기</h1>
          </div>
          <div class="actions">
            <div class="views" role="group" aria-label="보기">
              <button type="button" data-view="write" aria-pressed="true">쓰기</button>
              <button type="button" data-view="outline" aria-pressed="false">개요</button>
              <button type="button" data-view="read" aria-pressed="false">미리보기</button>
            </div>
            <span class="status" id="compose-status"></span>
            <button type="button" class="btn btn-quiet" id="back">초안으로</button>
            <button type="button" class="btn btn-primary" id="stash">원고로 저장</button>
          </div>
        </div>

        <div class="compose-body" id="compose-body">
          <div class="skel" id="skel">
            <span class="path" style="align-self: center">뼈대</span>
            <button type="button" class="chip" data-skel="상황,시도한 것,원인,회고">
              상황 → 시도 → 원인 → 회고
            </button>
            <button type="button" class="chip" data-skel="무엇을 하려 했나,막힌 지점,푼 방법">
              하려던 것 → 막힌 곳 → 푼 법
            </button>
            <button type="button" class="chip" data-skel="">비우기</button>
          </div>

          <div id="sections"></div>

          <button type="button" class="add" id="add">+ 소제목 추가</button>

          <div class="prose" id="prose" hidden></div>

          <details class="info">
            <summary>글 정보 — 원고로 저장할 때 맨 위에 붙는다</summary>
            <div class="grid">
              <div class="f wide">
                <label for="title">제목</label>
                <input id="title" type="text" placeholder="결론을 한 문장으로" />
              </div>
              <div class="f wide">
                <label for="desc">description</label>
                <input id="desc" type="text" placeholder="목록·검색에 뜨는 한 줄" />
              </div>
              <div class="f">
                <label for="slug">slug</label>
                <input id="slug" type="text" placeholder="loc-includes-the-end" />
                <span class="path" id="slug-path">posts/&lt;slug&gt;.md</span>
              </div>
              <div class="f">
                <label for="tags">tags <span class="path">쉼표로</span></label>
                <input id="tags" type="text" value="트러블슈팅, 성능" />
              </div>
            </div>
          </details>
        </div>
      </section>

      <!-- ── 오른쪽(또는 혼자일 때 가운데): 초안 ── -->
      <main class="main">
        <div class="bar">
          <div class="title">
            <h1 id="name">lightgbm-동시호출</h1>
            <span class="badge" id="badge">준비됨</span>
          </div>
          <div class="actions">
            <span class="status" id="status">저장됨 · 14:02</span>
            <button type="button" class="btn btn-quiet dock-toggle" id="dock" aria-expanded="true">
              접기
            </button>
            <button type="button" class="btn btn-quiet" id="save" disabled>저장 <kbd>⌘S</kbd></button>
            <button type="button" class="btn btn-quiet" id="ready">완성 취소</button>
            <button type="button" class="btn btn-primary" id="decide">초안 결정</button>
          </div>
        </div>

        <div class="draft-note" id="draft-note" hidden>
          <span>초안 · 읽기 전용</span>
          <span id="progress">0 / 0 줄</span>
          <span class="bar-meter"><i id="meter" style="width: 0%"></i></span>
        </div>

        <ul class="lines" id="lines"></ul>

        <p class="hint" id="hint">
          「완성」은 다음 Claude 세션에 넘기는 표시 · 「초안 결정」은 지금 이 화면에서 직접 글로 만드는
          것이다
        </p>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      // 목업 — 서버에 닿지 않는다. 가짜 메모 하나로 흐름만 눌러본다.
      //
      // 이 화면의 일은 하나다: 초안을 보면서 소제목 덩어리를 세우고, 어느 줄이 어느
      // 덩어리로 가는지 사람이 정하는 것. 문장은 만들어주지 않는다 — 가져오기는 원문을
      // 그대로 옮기고, 읽히게 고치는 건 왼쪽 칸에서 손으로 한다.
      const $ = s => document.querySelector(s);
      const app = $("#app");
      const composeEl = $("#compose");

      // ── 가짜 데이터 ──

      const MEMOS = [
        { name: "lightgbm-동시호출", state: "초안 결정" },
        { name: "빅데이터분석기사_실기후기", state: "준비됨" },
        { name: "agent-pipeline-lab", state: "작성 중" },
        { name: "어휘시리즈-후보", state: "작성 중" },
        { name: "항만도메인공부-3", state: "발행됨" },
      ];

      // 실제 메모처럼 거친 줄. 기호는 CLAUDE.md 「메모 표기 규약」 그대로다.
      const DRAFT = [
        { mk: "", t: "<!-- ✅ 준비됨 (2026-10-29) -->", kind: "mark" },
        { mk: "", t: "LightGBM 을 동시에 100번 호출하면", kind: "h2" },
        { mk: "", t: "추론 서버에 ab 로 동시 100 을 때려봤음. 응답이 7초까지 늘어남" },
        { mk: "?", t: "코어가 8개인데 왜 동시 8 쯤에서 안 꺾이고 100 까지 버티나" },
        { mk: "!", t: "num_threads 가 기본값이라 호출마다 8 스레드를 다 잡아서 서로 뺏고 있었다" },
        { mk: "", t: "num_threads=1 로 박고 다시 돌림. 7초 → 0.9초", kind: "code" },
        { mk: "+", t: "ab 말고 oha 가 낫다 — 동시 수를 올려도 클라이언트가 먼저 안 죽는다" },
        { mk: "?", t: "배치 추론으로 묶으면 스레드 싸움이 아예 없어지나" },
        { mk: "", t: "p99 가 평균보다 훨씬 나빴음. 평균만 보면 괜찮아 보였다" },
        { mk: "", t: "![](assets/lightgbm-동시호출/20261029-141230-9ab2.png)", kind: "img" },
        { mk: "+", t: "스레드 수는 컨테이너 CPU limit 과 따로 논다. 둘 다 봐야 한다" },
      ];

      // ── 상태 ──

      let sections = [{ title: "", body: "" }];
      let active = 0;
      const taken = new Set();
      let seq = 0;

      // ── 목록 ──

      $("#list").replaceChildren(
        ...MEMOS.map(m => {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          b.className = "item";
          if (m.state === "초안 결정") b.setAttribute("aria-current", "true");
          const n = document.createElement("span");
          n.className = "item-name";
          n.textContent = m.name;
          const s = document.createElement("span");
          s.className = "item-ready";
          s.textContent = m.state;
          if (m.state === "작성 중") {
            s.style.background = "transparent";
            s.style.color = "var(--muted)";
          }
          b.append(n, s);
          b.addEventListener("click", () => toast("목업이라 이 메모는 열리지 않는다"));
          li.append(b);
          return li;
        })
      );

      // ── 오른쪽 초안 ──

      const linesEl = $("#lines");
      const pullable = DRAFT.map((d, i) => i).filter(i => DRAFT[i].kind !== "mark");

      function renderDraft() {
        linesEl.replaceChildren(
          ...DRAFT.map((d, i) => {
            const li = document.createElement("li");
            li.className = "dl";
            li.dataset.mk = d.mk;
            if (taken.has(i)) li.classList.add("taken");

            const mk = document.createElement("span");
            mk.className = "mk";
            mk.textContent = d.mk;
            mk.setAttribute("aria-hidden", "true");

            const tx = document.createElement("span");
            tx.className = "tx" + (d.kind ? ` ${d.kind}` : "");
            tx.textContent = d.kind === "img" ? "🖼 " + d.t : d.t;

            li.append(mk, tx);

            if (d.kind !== "mark" && !taken.has(i)) {
              const pull = document.createElement("button");
              pull.type = "button";
              pull.className = "pull";
              pull.textContent = "◀ 가져오기";
              pull.setAttribute("aria-label", `${i + 1}번째 줄을 ${secLabel(active)} 로 가져오기`);
              pull.addEventListener("click", () => pullLine(i));
              li.append(pull);
            }
            return li;
          })
        );

        const done = [...taken].length;
        $("#progress").textContent = `${done} / ${pullable.length} 줄 옮김`;
        $("#meter").style.width = `${Math.round((done / pullable.length) * 100)}%`;
      }

      function secLabel(i) {
        return sections[i] && sections[i].title ? `「${sections[i].title}」` : `${i + 1}번째 덩어리`;
      }

      /** 원문 그대로 옮긴다. 기호는 떼고, 코드 줄만 울타리를 두른다 */
      function pullLine(i) {
        if (taken.has(i)) return;
        const d = DRAFT[i];
        const sec = sections[active];

        // 초안의 소제목 줄은 덩어리 제목 자리로. 이미 제목이 있으면 본문으로 간다
        if (d.kind === "h2" && !sec.title.trim()) {
          sec.title = d.t;
          taken.add(i);
          const input = document.querySelector(`.sec[data-i="${active}"] .sec-title`);
          if (input) input.value = d.t;
          renderDraft();
          renderPreview();
          toast("초안의 소제목을 덩어리 제목으로 넣었다 — 결론 문장으로 고쳐 쓰면 된다");
          return;
        }

        const text = d.kind === "code" ? "```\n" + d.t + "\n```" : d.t;
        sec.body = (sec.body ? sec.body.replace(/\n*$/, "\n\n") : "") + text;
        taken.add(i);

        const ta = document.querySelector(`.sec[data-i="${active}"] .sec-body`);
        if (ta) {
          ta.value = sec.body;
          ta.scrollTop = ta.scrollHeight;
        }
        renderDraft();
        renderCounts();
        if (d.mk === "?") toast("짝 없는 ? 다 — 답을 아직 모르면 글에 넣지 않아도 된다");
      }

      // ── 왼쪽 덩어리 ──

      const sectionsEl = $("#sections");

      function renderSections(focus) {
        sectionsEl.replaceChildren(
          ...sections.map((s, i) => {
            const art = document.createElement("article");
            art.className = "sec";
            art.dataset.i = String(i);
            if (i === active) art.setAttribute("aria-current", "true");
            art.addEventListener("focusin", () => setActive(i));
            art.addEventListener("click", e => {
              if (!e.target.closest(".ico")) setActive(i);
            });

            const head = document.createElement("header");
            head.className = "sec-head";

            const n = document.createElement("span");
            n.className = "sec-n";
            n.textContent = `${i + 1}.`;

            const title = document.createElement("input");
            title.className = "sec-title";
            title.type = "text";
            title.value = s.title;
            title.placeholder = "소제목 — 주제어 말고 결론 문장으로";
            title.setAttribute("aria-label", `${i + 1}번째 소제목`);
            title.addEventListener("input", () => {
              s.title = title.value;
              renderPreview();
            });

            const here = document.createElement("span");
            here.className = "here";
            here.textContent = "여기로";

            const up = ico("↑", "위로", () => move(i, -1), i === 0);
            const down = ico("↓", "아래로", () => move(i, 1), i === sections.length - 1);
            const del = ico("×", "덩어리 지우기", () => remove(i), sections.length === 1);

            head.append(n, title, here, up, down, del);

            const body = document.createElement("textarea");
            body.className = "sec-body";
            body.value = s.body;
            body.placeholder = "오른쪽에서 ◀ 로 가져오거나 직접 쓴다";
            body.setAttribute("aria-label", `${i + 1}번째 덩어리 본문`);
            body.addEventListener("input", () => {
              s.body = body.value;
              renderCounts();
              renderPreview();
            });

            const foot = document.createElement("p");
            foot.className = "sec-foot";
            foot.dataset.count = String(i);

            art.append(head, body, foot);
            return art;
          })
        );
        renderCounts();
        if (focus) {
          const el = document.querySelector(`.sec[data-i="${focus.i}"] .${focus.which}`);
          if (el) el.focus();
        }
      }

      function ico(label, aria, fn, disabled) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "ico";
        b.textContent = label;
        b.setAttribute("aria-label", aria);
        b.disabled = !!disabled;
        b.addEventListener("click", fn);
        return b;
      }

      function renderCounts() {
        for (const el of sectionsEl.querySelectorAll(".sec-foot")) {
          const s = sections[Number(el.dataset.count)];
          const chars = s.body.replace(/\s/g, "").length;
          const paras = s.body.split(/\n{2,}/).filter(p => p.trim()).length;
          el.textContent = chars ? `${paras}문단 · ${chars}자` : "비어 있다";
        }
      }

      function setActive(i) {
        if (active === i) return;
        active = i;
        for (const el of sectionsEl.querySelectorAll(".sec")) {
          if (Number(el.dataset.i) === i) el.setAttribute("aria-current", "true");
          else el.removeAttribute("aria-current");
        }
        renderDraft();
      }

      function move(i, d) {
        const j = i + d;
        if (j < 0 || j >= sections.length) return;
        [sections[i], sections[j]] = [sections[j], sections[i]];
        active = j;
        renderSections({ i: j, which: "sec-title" });
        renderPreview();
      }

      function remove(i) {
        if (sections.length === 1) return;
        const s = sections[i];
        if ((s.title || s.body).trim() && !confirm("쓴 게 있다. 이 덩어리를 지울까?")) return;
        sections.splice(i, 1);
        active = Math.min(active, sections.length - 1);
        renderSections();
        renderPreview();
      }

      $("#add").addEventListener("click", () => {
        sections.push({ title: "", body: "" });
        active = sections.length - 1;
        renderSections({ i: active, which: "sec-title" });
        renderPreview();
      });

      for (const b of document.querySelectorAll("[data-skel]")) {
        b.addEventListener("click", () => {
          const titles = b.dataset.skel ? b.dataset.skel.split(",") : [];
          const written = sections.some(s => (s.title || s.body).trim());
          if (written && !confirm("쓴 게 있다. 뼈대로 갈아끼울까?")) return;
          sections = (titles.length ? titles : [""]).map(t => ({ title: t, body: "" }));
          active = 0;
          taken.clear();
          renderSections();
          renderDraft();
          renderPreview();
        });
      }

      // ── 보기 전환 ──

      function setView(v) {
        composeEl.dataset.view = v;
        for (const b of document.querySelectorAll(".views button")) {
          b.setAttribute("aria-pressed", String(b.dataset.view === v));
        }
        sectionsEl.hidden = v === "read";
        $("#prose").hidden = v !== "read";
        $("#add").hidden = v !== "write";
        if (v === "read") renderPreview();
      }

      for (const b of document.querySelectorAll(".views button")) {
        b.addEventListener("click", () => setView(b.dataset.view));
      }

      // 작은 마크다운 렌더러. 읽히는지 보려는 것이라 제목 · 문단 · 코드 · 이미지만 다룬다
      function renderPreview() {
        if (composeEl.dataset.view !== "read") return;
        const out = document.createElement("div");

        const h1 = document.createElement("h2");
        h1.style.fontSize = "1.5em";
        h1.style.marginTop = "0";
        h1.textContent = $("#title").value || "(제목 없음)";
        if (!$("#title").value) h1.className = "thin";
        out.append(h1);

        for (const s of sections) {
          if (s.title) {
            const h = document.createElement("h2");
            h.textContent = s.title;
            out.append(h);
          }
          for (const block of s.body.split(/\n{2,}/)) {
            const t = block.trim();
            if (!t) continue;
            if (t.startsWith("```")) {
              const pre = document.createElement("pre");
              pre.textContent = t.replace(/^```\w*\n?/, "").replace(/```$/, "").trim();
              out.append(pre);
            } else if (/^!\[/.test(t)) {
              const ph = document.createElement("span");
              ph.className = "ph";
              ph.textContent = "🖼 " + (t.match(/\(([^)]+)\)/) || [, ""])[1];
              out.append(ph);
            } else {
              const p = document.createElement("p");
              p.textContent = t;
              out.append(p);
            }
          }
          if (!s.title && !s.body.trim()) {
            const p = document.createElement("p");
            p.className = "thin";
            p.textContent = "(빈 덩어리)";
            out.append(p);
          }
        }
        $("#prose").replaceChildren(...out.childNodes);
      }

      $("#title").addEventListener("input", renderPreview);

      $("#slug").addEventListener("input", () => {
        $("#slug-path").textContent = `posts/${$("#slug").value.trim() || "<slug>"}.md`;
      });

      // ── 모드 전환 ──

      function setMode(mode) {
        app.dataset.mode = mode;
        const composing = mode === "compose";
        $("#compose").hidden = !composing;
        $("#draft-note").hidden = !composing;
        $("#decide").hidden = composing;
        $("#save").hidden = composing;
        $("#ready").hidden = composing;
        $("#status").hidden = composing;
        $("#badge").textContent = composing ? "초안 결정" : "준비됨";
        $("#hint").textContent = composing
          ? "초안은 그대로 남는다 — 원고로 저장하면 맨 위에 발행됨 주석을 달고 published/ 로 옮긴다"
          : "「완성」은 다음 Claude 세션에 넘기는 표시 · 「초안 결정」은 지금 이 화면에서 직접 글로 만드는 것이다";
        if (composing) {
          renderSections({ i: 0, which: "sec-title" });
          renderDraft();
        } else {
          $("#decide").focus();
        }
      }

      $("#decide").addEventListener("click", () => {
        setMode("compose");
        toast("초안을 오른쪽으로 보냈다 · 왼쪽에서 덩어리를 세운다");
      });

      $("#back").addEventListener("click", () => setMode("draft"));

      $("#dock").addEventListener("click", () => {
        const open = app.dataset.dock !== "closed";
        app.dataset.dock = open ? "closed" : "open";
        $("#dock").textContent = open ? "펴기" : "접기";
        $("#dock").setAttribute("aria-expanded", String(!open));
      });

      // ── 원고로 저장 ──

      function fileText() {
        const tags = $("#tags")
          .value.split(",")
          .map(t => t.trim())
          .filter(Boolean);
        return (
          "---\n" +
          `title: ${$("#title").value || "<제목>"}\n` +
          `description: ${$("#desc").value || "<한 줄>"}\n` +
          `tags: [${tags.join(", ")}]\n` +
          "---\n\n" +
          sections
            .map(s => (s.title ? `## ${s.title}\n\n` : "") + s.body.trim())
            .filter(b => b.trim())
            .join("\n\n") +
          "\n"
        );
      }

      function openSheet() {
        const scrim = document.createElement("div");
        scrim.className = "scrim";
        scrim.innerHTML = `
          <div class="sheet" role="dialog" aria-modal="true" aria-label="원고로 저장">
            <div class="sheet-head">
              <h2>원고로 저장 — scratch 저장소</h2>
              <button type="button" class="btn btn-quiet" data-x>닫기</button>
            </div>
            <div class="sheet-body">
              <ol class="steps">
                <li>scratch 저장소에 <code>posts/&lt;slug&gt;.md</code> 로 커밋한다</li>
                <li>초안은 맨 위에 발행됨 주석을 달고 <code>published/</code> 로 옮긴다</li>
                <li>다음 Claude Code 세션이 집어서 보안 스크럽 · 이미지 변환 · <code>check:md</code> 를
                    돌리고 dev-blog 에 올린다</li>
              </ol>
              <p class="sec-note">
                서버 권한이 늘지 않는다. 토큰은 지금처럼 scratch 저장소 Contents 만 —
                <code>deploy/README.md</code> 의 「서버가 뚫려도 블로그에 글이 올라가지 않는다」가
                그대로 사실이다. 공개 저장소로 나가는 건 여전히 세션에서 한다.
              </p>
              <div class="filepane"></div>
            </div>
            <div class="sheet-foot">
              <span class="status">목업 — 누르면 아무 일도 일어나지 않는다</span>
              <button type="button" class="btn btn-primary" data-x>이대로 저장</button>
            </div>
          </div>`;
        scrim.querySelector(".filepane").textContent = fileText();
        scrim.addEventListener("click", e => {
          if (e.target === scrim || e.target.hasAttribute("data-x")) scrim.remove();
        });
        document.addEventListener(
          "keydown",
          e => {
            if (e.key === "Escape") scrim.remove();
          },
          { once: true }
        );
        document.body.append(scrim);
        scrim.querySelector("[data-x]").focus();
      }

      $("#stash").addEventListener("click", openSheet);

      // ── 알림 ──

      let toastTimer;
      function toast(message, error = false) {
        const el = $("#toast");
        el.textContent = message;
        el.classList.toggle("error", error);
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.hidden = true), error ? 6000 : 2600);
      }

      $("#ready").addEventListener("click", () => toast("목업에서는 표시가 바뀌지 않는다"));

      // ── 시작 ──

      renderDraft();
      renderSections();
    </script>
  </body>
</html>
