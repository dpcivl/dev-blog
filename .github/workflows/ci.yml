name: CI

permissions:
  contents: read

# main 에 직접 푸시하는 흐름이라 pull_request 만으로는 한 번도 돌지 않았다.
# 실제로 lint 가 91개 오류로 깨진 채 몇 달을 갔다. push 에서도 돌린다.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

# Action 은 커밋 SHA 로 고정한다. 이유는 deploy.yml 머리말 참고 — 두 파일의
# SHA 는 같이 올린다.
jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 버전은 저장소 핀을 따른다 — package.json 의 packageManager 와 .nvmrc.
      # 배포(deploy.yml)와 같은 런타임이어야 CI 통과가 배포 성공을 보장한다.
      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: "📦 Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🚀 Build the project"
        run: pnpm run build
