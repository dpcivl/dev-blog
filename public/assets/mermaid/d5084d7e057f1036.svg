<svg id="mermaid-30" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 276px;" viewBox="0 0 276 534" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mermaid-30{font-family:arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-30 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-30 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-30 .error-icon{fill:#552222;}#mermaid-30 .error-text{fill:#552222;stroke:#552222;}#mermaid-30 .edge-thickness-normal{stroke-width:1px;}#mermaid-30 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-30 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-30 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-30 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-30 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-30 .marker{fill:#333333;stroke:#333333;}#mermaid-30 .marker.cross{stroke:#333333;}#mermaid-30 svg{font-family:arial,sans-serif;font-size:16px;}#mermaid-30 p{margin:0;}#mermaid-30 .label{font-family:arial,sans-serif;color:#333;}#mermaid-30 .cluster-label text{fill:#333;}#mermaid-30 .cluster-label span{color:#333;}#mermaid-30 .cluster-label span p{background-color:transparent;}#mermaid-30 .label text,#mermaid-30 span{fill:#333;color:#333;}#mermaid-30 .node rect,#mermaid-30 .node circle,#mermaid-30 .node ellipse,#mermaid-30 .node polygon,#mermaid-30 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid-30 .rough-node .label text,#mermaid-30 .node .label text,#mermaid-30 .image-shape .label,#mermaid-30 .icon-shape .label{text-anchor:middle;}#mermaid-30 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mermaid-30 .rough-node .label,#mermaid-30 .node .label,#mermaid-30 .image-shape .label,#mermaid-30 .icon-shape .label{text-align:center;}#mermaid-30 .node.clickable{cursor:pointer;}#mermaid-30 .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#mermaid-30 .arrowheadPath{fill:#333333;}#mermaid-30 .edgePath .path{stroke:#333333;stroke-width:1px;}#mermaid-30 .flowchart-link{stroke:#333333;fill:none;}#mermaid-30 .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#mermaid-30 .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#mermaid-30 .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mermaid-30 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#mermaid-30 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#mermaid-30 .cluster text{fill:#333;}#mermaid-30 .cluster span{color:#333;}#mermaid-30 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#mermaid-30 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#mermaid-30 rect.text{fill:none;stroke-width:0;}#mermaid-30 .icon-shape,#mermaid-30 .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#mermaid-30 .icon-shape p,#mermaid-30 .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#mermaid-30 .icon-shape .label rect,#mermaid-30 .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mermaid-30 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mermaid-30 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mermaid-30 .node .neo-node{stroke:#9370DB;}#mermaid-30 [data-look="neo"].node rect,#mermaid-30 [data-look="neo"].cluster rect,#mermaid-30 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px