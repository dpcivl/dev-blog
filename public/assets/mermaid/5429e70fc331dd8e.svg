rmaid-20 .node .label,#mermaid-20 .image-shape .label,#mermaid-20 .icon-shape .label{text-align:center;}#mermaid-20 .node.clickable{cursor:pointer;}#mermaid-20 .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#mermaid-20 .arrowheadPath{fill:#333333;}#mermaid-20 .edgePath .path{stroke:#333333;stroke-width:1px;}#mermaid-20 .flowchart-link{stroke:#333333;fill:none;}#mermaid-20 .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#mermaid-20 .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#mermaid-20 .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mermaid-20 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#mermaid-20 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#mermaid-20 .cluster text{fill:#333;}#mermaid-20 .cluster span{color:#333;}#mermaid-20 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#mermaid-20 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#mermaid-20 rect.text{fill:none;stroke-width:0;}#mermaid-20 .icon-shape,#mermaid-20 .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#mermaid-20 .icon-shape p,#mermaid-20 .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#mermaid-20 .icon-shape .label rect,#mermaid-20 .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mermaid-20 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mermaid-20 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mermaid-20 .node .neo-node{stroke:#9370DB;}#mermaid-20 [data-look="neo"].node rect,#mermaid-20 [data-look="neo"].cluster rect,#mermaid-20 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px