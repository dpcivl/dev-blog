# parkhyo.in — 부트스트랩 (HTTP 전용)
#
# 인증서를 받기 전까지 쓰는 임시 설정. 본 설정(parkhyo.in.conf)은 443 블록에서
# 인증서 경로를 참조하므로, 파일이 없으면 `nginx -t` 가 실패해 nginx 가 뜨지 않는다.
#
#   1) 이 파일로 먼저 올려서 IP 로 배포를 검증한다
#   2) 인증서를 받는다
#   3) parkhyo.in.conf 로 교체한다
#
# 배치: /etc/nginx/sites-available/ → sites-enabled 링크 (default 는 지운다)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name parkhyo.in www.parkhyo.in _;

    root /var/www/parkhyo.in/current;
    index index.html;

    # certbot HTTP-01 챌린지 (DNS 전환 후 갱신에 쓴다)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
