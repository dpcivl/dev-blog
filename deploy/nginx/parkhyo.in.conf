# parkhyo.in — Lightsail nginx 설정
#
# 목적: Vercel 이 주던 동작을 그대로 재현한다.
#   - www → apex 308 (경로 보존)
#   - http → https 308
#   - HTML 은 매번 재검증, 해시 붙은 에셋은 1년 불변
#   - HSTS 유지 (Vercel 이 이미 보내고 있어 브라우저에 캐시되어 있다)
#
# 배치: /etc/nginx/sites-available/parkhyo.in.conf → sites-enabled 심볼릭 링크
#
# HTTP/2 는 `listen ... http2` 형식으로 켠다. 독립 지시어 `http2 on;` 은
# nginx 1.25 부터라 Ubuntu 24.04 의 1.24 에서는 "unknown directive" 로 죽는다.

# ── 방문 통계용 로그 분리 ────────────────────────────────────────
# 모든 요청을 기록해두고 나중에 거르면 필터가 샌다. 실제로 TikTokSpider ·
# Bytespider · curl 이 "실방문" 으로 집계됐다. nginx 가 기록 단계에서
# 나누면 새지 않고, GoAccess 의 증분 처리도 그대로 쓸 수 있다.
#
#   access.log  전체 (크롤러 리포트 · 디버깅)
#   human.log   사람 요청만 (방문 통계)

# 자기를 밝히는 봇, 자동화 도구, 빈 UA 를 제외한다.
map $http_user_agent $ua_human {
    default                                             1;
    ""                                                  0;
    "~*(bot|crawler|crawl|spider|slurp|scrapy|fetch)"    0;
    "~*(curl|wget|libwww|python-|go-http|java/|okhttp)"  0;
    "~*(headless|phantomjs|puppeteer|playwright)"        0;
    "~*(monitor|uptime|pingdom|validation|preview)"      0;
}

# 페이지 요청만 센다. 정적 파일과 통계 페이지 자체는 뺀다.
map $uri $uri_page {
    default                                                  1;
    "~*^/(_astro|pagefind|stats)/"                            0;
    "~*\.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|css|js|xml|txt|json|mp4)$"  0;
}

map "$ua_human$uri_page" $log_human {
    default  0;
    "11"     1;
}

# ── http → https ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name parkhyo.in www.parkhyo.in;

    # certbot HTTP-01 챌린지는 통과시킨다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://parkhyo.in$request_uri;
    }
}

# ── www → apex ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.parkhyo.in;

    ssl_certificate     /etc/letsencrypt/live/parkhyo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkhyo.in/privkey.pem;

    return 308 https://parkhyo.in$request_uri;
}

# ── 본체 ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name parkhyo.in;

    ssl_certificate     /etc/letsencrypt/live/parkhyo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkhyo.in/privkey.pem;

    root /var/www/parkhyo.in/current;
    index index.html;

    # 전체 로그는 기본값(access.log)대로 남고, 사람 요청만 따로 한 벌 더 쓴다
    access_log /var/log/nginx/human.log combined if=$log_human;

    # Vercel 과 동일한 값. 전환 시점에 유효한 인증서가 없으면
    # 브라우저가 접속 자체를 거부하므로 인증서를 먼저 확보할 것.
    add_header Strict-Transport-Security "max-age=63072000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # HTML — 항상 재검증
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # 해시가 붙은 빌드 산출물 — 1년 불변
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # 이미지 · 폰트 · 영상 — 한 달
    location ~* \.(webp|png|jpe?g|gif|svg|woff2?|mp4)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # Pagefind 색인 — 빌드마다 바뀌므로 짧게
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # ── 방문 통계 (/stats) ────────────────────────────────────────
    # 대시보드 HTML 은 Astro 가 빌드해 릴리스에 들어간다 (root 에서 서빙).
    # 데이터(JSON)와 GoAccess 원본 리포트는 서버가 시간마다 만들어
    # /var/www/stats 에 두므로, 그 경로만 alias 로 따로 잡는다.
    # 셋 다 같은 basic auth 아래 있어야 한다.

    location = /stats {
        return 301 /stats/;
    }

    location /stats/ {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;

        # root(릴리스)에서 Astro 가 만든 /stats/index.html 을 찾는다
        try_files $uri $uri/ /stats/index.html;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # 시간마다 갱신되는 데이터 — 릴리스 밖에 있다
    location = /stats/report.json {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        alias /var/www/stats/report.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /stats/bots/report.json {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        alias /var/www/stats/bots/report.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # GoAccess 원본 리포트 (디버깅용)
    location /stats/raw/ {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        alias /var/www/stats/raw/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location /stats/bots/ {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        alias /var/www/stats/bots/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
