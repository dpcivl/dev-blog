# parkhyo.in — Lightsail nginx 설정
#
# 목적: Vercel 이 주던 동작을 그대로 재현한다.
#   - www → apex 308 (경로 보존)
#   - http → https 308
#   - HTML 은 매번 재검증, 해시 붙은 에셋은 1년 불변
#   - HSTS 유지 (Vercel 이 이미 보내고 있어 브라우저에 캐시되어 있다)
#
# 배치: /etc/nginx/sites-available/parkhyo.in.conf → sites-enabled 심볼릭 링크
#
# HTTP/2 는 `listen ... http2` 형식으로 켠다. 독립 지시어 `http2 on;` 은
# nginx 1.25 부터라 Ubuntu 24.04 의 1.24 에서는 "unknown directive" 로 죽는다.

# ── 방문 통계용 로그 분리 ────────────────────────────────────────
# 모든 요청을 기록해두고 나중에 거르면 필터가 샌다. 실제로 TikTokSpider ·
# Bytespider · curl 이 "실방문" 으로 집계됐다. nginx 가 기록 단계에서
# 나누면 새지 않고, GoAccess 의 증분 처리도 그대로 쓸 수 있다.
#
#   access.log  전체 (크롤러 리포트 · 디버깅)
#   human.log   사람 요청만 (방문 통계)

# 자기를 밝히는 봇, 자동화 도구, 빈 UA 를 제외한다.
# 응답 Server 헤더에서 버전을 뺀다 (2026-10-09). 전에는 nginx/1.24.0 (Ubuntu)
# 가 그대로 나가서, 이 버전의 알려진 취약점을 찾는 수고를 덜어주고 있었다.
server_tokens off;

map $http_user_agent $ua_human {
    default                                             1;
    ""                                                  0;
    "~*(bot|crawler|crawl|spider|slurp|scrapy|fetch)"    0;
    "~*(curl|wget|libwww|python-|go-http|java/|okhttp)"  0;
    "~*(headless|phantomjs|puppeteer|playwright)"        0;
    "~*(monitor|uptime|pingdom|validation|preview)"      0;
    # 취약점 스캐너 · SNS 미리보기 — 봇이라고 안 적고 다닌다 (2026-09-23)
    "~*(scan|leakix|l9|nuclei|zgrab|masscan|nmap|sqlmap)"        0;
    "~*(facebookexternalhit|externalagent|externalhit|embedly)"  0;
}

# 상태 코드로 거른다. 이게 제일 크다.
#
# 2026-09-23 실측: 하루 776 요청 중 604(78%)가 404 였고, 그중 234개가
# wp-login · .env · phpmyadmin 같은 취약점 탐색 경로였다. GCP 대역 IP 두 개가
# 각각 281개 경로를 같은 1초 안에 훑고 갔는데, UA 가 평범한 크롬이라
# 위 문자열 필터에 하나도 안 걸렸다. UA 는 요청자가 적는 값이라 못 믿는다.
#
# 반면 진짜 독자는 404 를 거의 안 낸다. 이 두 IP 만 빼도 방문당 페이지가
# 6.2 → 1.7 로 떨어졌다(학습 블로그 통상 범위).
#
# 301 은 뺀다. /portfolio → /portfolio/ 처럼 곧바로 200 이 따라오므로
# 같이 세면 한 번의 방문이 두 번으로 잡힌다.
map $status $status_human {
    default        0;
    "~^(200|304)$" 1;
}

# 페이지 요청만 센다. 정적 파일과 통계 페이지 자체는 뺀다.
map $uri $uri_page {
    default                                                  1;
    "~*^/(_astro|pagefind|stats)/"                            0;
    "~*\.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|css|js|xml|txt|json|mp4)$"  0;
}

# 본인 IP 등 통계에서 뺄 주소. 목록은 서버에만 두고 저장소에는 올리지 않는다
# (집 IP 는 개인정보다). 파일이 없으면 nginx 가 뜨지 않으므로 반드시 만들 것:
#   echo '# 형식: <IP> 0;' | sudo tee /etc/nginx/conf.d/stats-exclude-ips.map
map $remote_addr $ip_human {
    default 1;
    include /etc/nginx/conf.d/stats-exclude-ips.map;
}

# Accept-Language 가 없으면 브라우저가 아니다. (2026-10-01 실측)
#
# 며칠 모은 human-probe.log 로 판정이 끝났다. 집계되던 365건의 언어 분포가
# 이랬다.
#
#   zh-CN       123
#   (헤더 없음)   121      ← 진짜 브라우저는 이 헤더를 반드시 보낸다
#   en-US       113
#   ko-KR + ko    2      ← 한국어 블로그인데 이틀에 2건이다
#
# 헤더가 아예 없는 121건을 뺀다. 이 한 줄로 33% 가 걸러진다.
# zh-CN 은 안 뺀다 — 중국어권 독자가 실제로 올 수 있고, 언어로 사람을
# 가르는 건 필터가 아니라 차별이다. 봇이면 다른 조건에 걸리게 둔다.
map $http_accept_language $lang_human {
    default  1;
    ""       0;
}

# 통계에 넣을 요청 — 다섯 조건을 모두 통과해야 한다
map "$ua_human$uri_page$ip_human$status_human$lang_human" $log_human {
    default  0;
    "11111"  1;
}

# 관찰용은 일부러 언어 조건을 뺀 채로 둔다. 새 필터가 무엇을 빼고 있는지
# 보려면 빼기 전 모습이 남아 있어야 한다. human.log 와 human-probe.log 의
# 줄 수 차이가 곧 언어 필터가 거른 양이다.
map "$ua_human$uri_page$ip_human$status_human" $log_probe {
    default  0;
    "1111"   1;
}

# 비밀번호 변경 호출 제한. bcrypt 해싱은 의도적으로 느리므로 연달아
# 부르면 CPU 를 먹는다. 분당 5회면 사람이 쓰기엔 넉넉하다.
# /stats 로그인 시도 제한.
#
# 2026-10-02 점검에서 나온 구멍이다. 비밀번호 변경 엔드포인트는 분당 5회로
# 막아뒀는데 basic auth 자체는 무제한이었다. 23자 비밀번호라 현실적으로는
# 못 뚫지만, 횟수 제한은 비밀번호 길이와 별개로 있어야 한다.
#
# 분당 60회로 넉넉히 둔다. 대시보드 한 번 열 때 /stats/ · report.json ·
# bots/report.json 으로 3건이 나가고, 기간 버튼을 누르면 더 나간다. 여기를
# 조이면 정상 사용이 막힌다. 초당 1회로도 무차별 대입은 의미가 없어진다.
limit_req_zone $binary_remote_addr zone=statsauth:1m rate=60r/m;

limit_req_zone $binary_remote_addr zone=statspw:1m rate=5r/m;

# 한도 초과는 429 로 답한다. nginx 기본값 503 은 "서버가 고장났다" 는 뜻이라
# 화면에 그대로 띄우면 쓰는 사람이 오해한다.

# ── 비콘 (2026-10-02~) ───────────────────────────────────────────
# JS 를 실행한 브라우저만 닿는 수집 지점. Vercel Analytics 가 쓰던 방식이다.
#
# 왜 로그로는 안 됐나 — 로그는 "서버에 도착한 요청" 을 센다. 봇도 요청을
# 보내므로 전부 들어오고, 사람인지는 추측해야 한다. 2026-10-02 실측에서
# 집계된 156건 중 자산까지 받은 것(= 브라우저로 보이는 것)이 39건이었다.
#
# 비콘은 다른 걸 센다 — "페이지를 띄우고 JS 를 돌린 것". 봇은 대부분 JS 를
# 실행하지 않으므로 추측이 필요 없다. 측정 지점을 사람 쪽으로 옮기는 것이다.
#
# 대신 이쪽은 과소 집계된다 (JS 끈 사람, 차단기 쓰는 사람). Vercel 도 그랬다.
# 그래서 로그 기반 수치도 /stats/raw/ 에 남겨 둘을 같이 본다.

# 경로를 쿼리가 아니라 URL 경로에 담는다 — /b/posts/foo/ 처럼.
#
# 처음엔 /b?p=... 로 했는데 안 됐다. $arg_p 는 URL 디코딩이 안 된 날값이라
# 「%2Fposts%2F…」 로 시작하고, / 로 시작하길 기대한 검증에 전부 떨어졌다.
# 반면 $uri 는 nginx 가 디코딩·정규화까지 해준 값이라 그 문제가 없다
# (경로 안의 /../ 도 정리돼서 들어온다).
map $uri $beacon_path {
    default        "";
    "~^/b(/.*)$"   $1;
}

map $beacon_path $beacon_ok {
    default  1;
    ""       0;
}

# 글을 연 것만 센다 (2026-10-04). 목록 · 홈 · 소개 페이지는 0 이다.
#
# 왜: 비콘은 JS 실행을 재니까 사람이라고 봤는데 아니었다. 중국 가정용 IP
# 풀을 쓰는 크롤러가 헤드리스 브라우저로 돌면서 폰트 · CSS 까지 다 받고
# 비콘까지 쏜다. 하루 20건 안팎으로 209개 IP 가 들어왔고 그중 185개는
# 딱 한 번, 글을 연 적 있는 건 7개뿐이었다. 전부 「/tags」 같은 목록이었다.
# 목록을 한 장 보고 사라지는 것과 글을 여는 것은 다르게 세는 게 맞다.
#
# 글 한 편만 읽고 가는 진짜 독자도 세어진다 (이게 1번 안보다 나은 점이다).
# 대신 홈만 보고 간 사람은 안 세어진다 — 감수한 쪽이다.
map $beacon_path $beacon_article {
    default                0;
    "~^/posts/[^/]+/$"     1;
    "~^/en/posts/[^/]+/$"  1;
}

# UA 필터와 본인 IP 제외는 그대로 적용한다. JS 를 실행하는 봇도 있고,
# 본인 방문은 통계에서 빼는 게 맞다.
map "$ua_human$ip_human$beacon_ok" $log_beacon {
    default  0;
    "111"    1;
}

# 세는 쪽 — 위 조건을 다 통과하고 글 페이지일 때만 1
map "$log_beacon$beacon_article" $log_beacon_article {
    default  0;
    "11"     1;
}

# 비콘이 보내온 경로를 '요청' 자리에 적는다. 그래야 GoAccess 의 인기 글
# 패널이 실제 글 주소로 나온다. 상태 코드는 200 으로 고정한다 — 비콘 자체는
# 204 를 돌려주지만 그걸 적으면 GoAccess 가 페이지뷰로 안 센다.
# sendBeacon 은 POST 로 온다. "GET" 을 박아뒀더니 로그가 사실과 달랐다.
log_format beacon '$remote_addr - - [$time_local] "$request_method $beacon_path HTTP/1.1" '
                  '200 0 "$http_referer" "$http_user_agent"';

# 비콘은 요청자가 마음대로 부를 수 있으므로 반드시 제한한다. 안 막으면
# 누가 두들겨서 통계를 부풀릴 수 있다. 빠르게 읽는 사람도 분당 30장을
# 넘기긴 어렵다.
limit_req_zone $binary_remote_addr zone=beacon:1m rate=30r/m;

# 관찰용 포맷 — combined 뒤에 Accept-Language 를 덧붙인다.
log_format human_probe '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" lang="$http_accept_language"';

# ── 도메인이 아닌 Host 는 안 받는다 ──────────────────────────────
#
# 2026-10-01: 레퍼러 1위가 도메인이 아니라 EC2 기본 호스트명이었다.
#
#   https://ec2-<서버IP>.ap-northeast-2.compute.amazonaws.com   1,238건
#   https://parkhyo.in                                            685건
#
# default_server 가 없으면 nginx 는 아무 Host 로 들어온 요청을 첫 번째 server
# 블록으로 보낸다. 그래서 봇이 EC2 호스트명이나 생 IP 로 사이트를 발견하고
# 통째로 긁어갔다. 통계만의 문제가 아니라 같은 내용이 두 주소로 노출되던
# 것이기도 하다.
#
# 444 는 nginx 전용 코드로, 응답을 안 주고 연결을 끊는다. 403 처럼 본문을
# 돌려주면 그것도 트래픽이고 스캐너에겐 "살아 있다" 는 신호가 된다.
#
# ⚠️ 이 블록이 도메인 요청을 삼키면 사이트가 통째로 죽는다. 반영 후 반드시
#    도메인으로 200 이 나오는지 먼저 확인할 것.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # certbot 챌린지는 Host 가 도메인으로 오므로 아래 블록이 받는다.
    # 여기로 오는 건 생 IP · EC2 호스트명 · 남의 도메인뿐이다.
    return 444;
}

server {
    # http2 를 빼면 안 된다. nginx 1.24 에서 http2 는 listen 소켓 단위 설정이라
    # 같은 포트의 다른 블록과 다르면 "protocol options redefined" 경고가 난다.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # 인증서를 내주지 않고 TLS 악수 단계에서 끊는다. parkhyo.in 인증서를
    # 생 IP 접속에 보여줄 이유가 없다. (nginx 1.19.4+)
    ssl_reject_handshake on;
}

# ── http → https ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name parkhyo.in www.parkhyo.in;

    # certbot HTTP-01 챌린지는 통과시킨다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://parkhyo.in$request_uri;
    }
}

# ── www → apex ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.parkhyo.in;

    ssl_certificate     /etc/letsencrypt/live/parkhyo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkhyo.in/privkey.pem;

    return 308 https://parkhyo.in$request_uri;
}

# ── 본체 ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name parkhyo.in;

    ssl_certificate     /etc/letsencrypt/live/parkhyo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkhyo.in/privkey.pem;

    root /var/www/parkhyo.in/current;
    index index.html;

    # ⚠️ 이 줄이 없으면 안 된다. nginx 는 server 블록에 access_log 를 쓰는 순간
    # 상위(http)에서 물려받은 기본 로그를 덮어쓴다. 아래 human.log 만 적어두면
    # 필터에 걸러진 HTTPS 요청이 어디에도 안 남는다 — 크롤러 리포트가 비고,
    # 나중에 "이 트래픽이 뭐였나" 를 되짚을 수가 없다. (2026-09-23 실제로 그랬다)
    access_log /var/log/nginx/access.log combined;

    # 전체 로그는 위 access.log 에 남고, 사람 요청만 따로 한 벌 더 쓴다
    access_log /var/log/nginx/human.log combined if=$log_human;

    # 관찰용 (2026-09-23~). 언어 조건 '전' 의 모습을 남긴다 ($log_probe).
    # human.log 와 이 파일의 줄 수 차이가 언어 필터가 거른 양이다.
    access_log /var/log/nginx/human-probe.log human_probe if=$log_probe;

    # Vercel 과 동일한 값. 전환 시점에 유효한 인증서가 없으면
    # 브라우저가 접속 자체를 거부하므로 인증서를 먼저 확보할 것.
    add_header Strict-Transport-Security "max-age=63072000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # HTML — 항상 재검증
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # 해시가 붙은 빌드 산출물 — 1년 불변
    #
    # ^~ 가 필요하다. 정규식 location 은 prefix location 보다 우선하므로,
    # 이게 없으면 /_astro/fonts/*.woff2 가 아래 확장자 규칙(30일)에 잡힌다.
    # 실제로 그랬고 Lighthouse 가 "비효율적 캐시 정책" 으로 지적했다.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # 자체 호스팅 폰트 — 경로에 버전이 박혀 있어 1년 불변으로 둬도 안전하다
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # 이미지 · 폰트 · 영상 — 한 달
    location ~* \.(webp|png|jpe?g|gif|svg|woff2?|mp4)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # Pagefind 색인 — 빌드마다 바뀌므로 짧게
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # ── 방문 통계 (/stats) ────────────────────────────────────────
    # 대시보드 HTML 은 Astro 가 빌드해 릴리스에 들어간다 (root 에서 서빙).
    # 데이터(JSON)와 GoAccess 원본 리포트는 서버가 시간마다 만들어
    # /var/www/stats 에 두므로, 그 경로만 alias 로 따로 잡는다.
    # 셋 다 같은 basic auth 아래 있어야 한다.

    location = /stats {
        return 301 /stats/;
    }

    # ^~ 가 꼭 있어야 한다 (2026-10-09). 없으면 아래 이미지 확장자 정규식이
    # 먼저 걸려서 /stats/x.svg 가 인증 없이 응답했다 (401 이 아니라 404).
    # 지금은 그 자리에 이미지가 없어 새는 게 없었지만, 하나 두는 순간 공개된다.
    # /stats/raw/ · /stats/bots/ 도 같은 이유로 ^~ 다 — nginx 는 가장 긴 접두사를
    # 먼저 고르고, 그게 ^~ 가 아니면 정규식을 다시 보기 때문이다.
    location ^~ /stats/ {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        limit_req zone=statsauth burst=20 nodelay;
        limit_req_status 429;

        # root(릴리스)에서 Astro 가 만든 /stats/index.html 을 찾는다
        try_files $uri $uri/ /stats/index.html;

        add_header X-Robots-Tag "noindex, nofollow" always;
        # 남의 페이지에 끼워 넣지 못하게 한다 — 비밀번호 화면을 투명하게 덮어
        # 누르게 만드는 공격(클릭재킹)을 막는다. 구형 브라우저용으로 X-Frame-Options 도.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # 시간마다 갱신되는 데이터 — 릴리스 밖에 있다
    # 비콘 수집 지점. 본문이 없는 204 라 전송량이 0 에 가깝다.
    #
    # ^~ 를 쓴다. 이게 없으면 아래 확장자 정규식 location 들이 먼저 걸린다
    # (/b/posts/foo.html 같은 경로가 올 수 있다).
    location ^~ /b/ {
        limit_req zone=beacon burst=10 nodelay;
        limit_req_status 429;

        # ⚠️ location 에 access_log 를 쓰면 상위(server)에서 물려받은 것이
        # 전부 무효가 된다. 그래서 전체 로그를 여기 다시 적는다. human.log 는
        # 일부러 안 적는다 — /b 는 페이지가 아니므로 글 통계에 섞이면 안 된다.
        access_log /var/log/nginx/access.log combined;

        # beacon.log = 대시보드가 세는 것 (글 페이지만)
        # beacon-all.log = 거르기 '전' 기준선. human-probe.log 와 같은 역할로,
        #                  두 로그의 줄 수 차이가 목록 페이지에서 걸러낸 양이다.
        access_log /var/log/nginx/beacon.log     beacon if=$log_beacon_article;
        access_log /var/log/nginx/beacon-all.log beacon if=$log_beacon;

        add_header Cache-Control "no-store" always;
        return 204;
    }

    # 비밀번호 변경 — 위 location 과 같은 basic auth 뒤에 둔다.
    # 인증을 nginx 가 여기서 끝내므로 뒤의 서비스는 인증을 또 하지 않는다.
    location = /stats/api/password {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;

        # 여기만 statsauth 가 아니라 statspw 를 쓴다. 더 센 쪽만 있으면 되고,
        # 두 존을 같이 걸면 느슨한 쪽은 아무 일도 안 하면서 설정만 늘어난다.
        #
        # 비밀번호를 때려 맞히는 것은 basic auth 가 막지만, 통과한 뒤에
        # 반복 호출로 htpasswd 를 두드리는 것은 따로 막는다. bcrypt 는
        # 일부러 느려서 연달아 부르면 CPU 를 먹는다.
        limit_req zone=statspw burst=3 nodelay;
        limit_req_status 429;

        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Cache-Control 은 서비스가 직접 낸다. 여기서 또 적으면 두 줄이 된다.

        proxy_pass http://unix:/run/parkhyo-stats-password.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = /stats/report.json {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        limit_req zone=statsauth burst=20 nodelay;
        limit_req_status 429;
        alias /var/www/stats/report.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # 남의 페이지에 끼워 넣지 못하게 한다 — 비밀번호 화면을 투명하게 덮어
        # 누르게 만드는 공격(클릭재킹)을 막는다. 구형 브라우저용으로 X-Frame-Options 도.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /stats/bots/report.json {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        limit_req zone=statsauth burst=20 nodelay;
        limit_req_status 429;
        alias /var/www/stats/bots/report.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # 남의 페이지에 끼워 넣지 못하게 한다 — 비밀번호 화면을 투명하게 덮어
        # 누르게 만드는 공격(클릭재킹)을 막는다. 구형 브라우저용으로 X-Frame-Options 도.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # GoAccess 원본 리포트 (디버깅용)
    location ^~ /stats/raw/ {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        limit_req zone=statsauth burst=20 nodelay;
        limit_req_status 429;
        alias /var/www/stats/raw/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # 남의 페이지에 끼워 넣지 못하게 한다 — 비밀번호 화면을 투명하게 덮어
        # 누르게 만드는 공격(클릭재킹)을 막는다. 구형 브라우저용으로 X-Frame-Options 도.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /stats/bots/ {
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        limit_req zone=statsauth burst=20 nodelay;
        limit_req_status 429;
        alias /var/www/stats/bots/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # 남의 페이지에 끼워 넣지 못하게 한다 — 비밀번호 화면을 투명하게 덮어
        # 누르게 만드는 공격(클릭재킹)을 막는다. 구형 브라우저용으로 X-Frame-Options 도.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
