# 서버 파이썬(server/*.py)만 대상이다. 블로그 쪽은 vitest 가 본다.
#
# 러너는 uv 로 띄운다 — `pnpm test:py` 가 `uv run --with pytest pytest` 다.
# 저장소에 venv 를 커밋하지 않고 두 기기(Windows · macOS)에서 같은 명령으로
# 돌리려고 이렇게 했다. uv 가 없으면 설치해야 한다 (macOS `brew install uv`,
# Windows `winget install astral-sh.uv`).
[pytest]
testpaths = tests/server
python_files = test_*.py
